name: Validate OpenAPI Spec

on:
  push:    
    paths: ['openapi.yaml']
  pull_request:
    paths: ['openapi.yaml']

jobs:
  lint:
    name: Redocly Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g @redocly/cli
      - run: redocly lint openapi.yaml

  validate-schema:
    name: Swagger Parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g @apidevtools/swagger-cli
      - run: swagger-cli validate openapi.yaml

  build-json:
    name: Generate openapi.json
    runs-on: ubuntu-latest
    needs: [lint, validate-schema]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g @redocly/cli
      - run: redocly bundle openapi.yaml -o openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-json
          path: openapi.json

  generate-client:
    name: TypeScript client smoke test
    runs-on: ubuntu-latest
    needs: [lint, validate-schema]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g @openapitools/openapi-generator-cli
      - run: |
          openapi-generator-cli generate \
            -i openapi.yaml \
            -g typescript-fetch \
            -o ts-client \
            --skip-validate-spec
